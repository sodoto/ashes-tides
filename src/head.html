<title>Ashes &amp; Tides</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow+Semi+Condensed:wght@400;500;600&family=Grenze+Gotisch:wght@600;800&display=swap">
<style>
/* Layout: one phone-width column. Opponent on top, a shared walnut dice tray in the middle, my abilities and hand at the bottom. */
:root{
  color-scheme:dark;
  --felt:#141a2b; --felt-hi:#1f2a47; --panel:#1a2238; --panel-hi:#252f4b; --line:rgba(255,255,255,.09);
  --text:#ece7dc; --muted:#9aa3b8;
  --walnut:#42301f; --walnut-lo:#2c2016;
  --bone:#efe6d0; --bone-lo:#c9b98f;
  --gold:#e3b34f; --gold-ink:#2a1d05;
  --ember:#f0803f; --brine:#5cc6ba;
  --t-main:#6b9bf2; --t-roll:#ec9a4f; --t-instant:#ec6a62; --t-upgrade:#b48cf0;
  --bad:#e8574f; --good:#6fcf8f; --shieldc:#9cc4ff; --chillc:#9ad7ff;
  --display:'Grenze Gotisch','Iowan Old Style',Georgia,serif;
  --body:'Barlow Semi Condensed','Segoe UI',system-ui,sans-serif;
  --num:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box}
html{background:var(--felt)}
html,body{height:100%}
body{
  margin:0;background-color:var(--felt);color:var(--text);
  background-image:radial-gradient(130% 60% at 50% 0%,var(--felt-hi),transparent 72%);background-repeat:no-repeat;
  font-family:var(--body);font-size:15px;line-height:1.3;-webkit-tap-highlight-color:transparent;
  padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{max-width:460px;margin:0 auto;min-height:100%}
.game{display:flex;flex-direction:column;gap:8px;min-height:100%}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 11px 8px;display:grid;gap:7px;position:relative}
.panel.active{border-color:color-mix(in srgb,var(--hc) 75%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hc) 35%,transparent)}
.panel.opp{cursor:pointer}
.p-top{display:flex;align-items:center;gap:9px;min-width:0}
.sigil{flex:none}
.p-id{flex:1;min-width:0}
.p-name{font-family:var(--display);font-weight:800;font-size:19px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-sub{font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
.chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.chip{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:3px;padding:2px 8px 2px 5px;border-radius:999px;background:rgba(255,255,255,.08);font:700 13px var(--num);letter-spacing:.03em}
.chip.burn{color:var(--ember)} .chip.boost{color:var(--gold);background:rgba(227,179,79,.16)} .chip.chill{color:var(--chillc)} .chip.shield{color:var(--shieldc)}
.hpbar{position:relative;height:22px;border-radius:7px;background:#0e1424;overflow:hidden}
.hpfill{display:block;height:100%;background:var(--hc);transition:width .6s ease}
.hpnum{position:absolute;inset:0;display:flex;align-items:center;padding-left:9px;font:700 16px var(--num);text-shadow:0 1px 3px rgba(0,0,0,.7)}
.hpnum small{font-size:12px;opacity:.7;margin-left:1px}
.p-bot{display:flex;justify-content:space-between;align-items:center;font:600 13px var(--num);color:var(--muted);letter-spacing:.04em}
.cp{display:flex;align-items:center;gap:5px}
.gem{display:inline-block;width:9px;height:9px;border-radius:2px;transform:rotate(45deg);background:rgba(255,255,255,.12)}
.gem.on{background:var(--gold)}
.cpn{margin-left:6px;color:var(--text)}
.fxnum{position:absolute;right:16px;top:8px;font:700 28px var(--num);pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.7);animation:floatup 1.2s ease-out forwards}
.fxnum.dmg{color:var(--bad)} .fxnum.burn{color:var(--ember)} .fxnum.heal{color:var(--good)} .fxnum.shield{color:var(--shieldc)}
@keyframes floatup{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}

/* log row */
.logrow{display:flex;align-items:center;gap:8px}
.logline{flex:1;min-width:0;min-height:36px;display:flex;flex-direction:column;justify-content:center;gap:1px;background:none;border:0;padding:0 2px;text-align:left;cursor:pointer;font-size:13px;color:var(--muted)}
.logline span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logline span:last-child{color:var(--text)}
.menubtn{flex:none;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font:600 13px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer}

/* dice tray */
.table{background:linear-gradient(var(--walnut),var(--walnut-lo));border-radius:16px;padding:10px 12px 14px;display:grid;gap:10px;box-shadow:inset 0 3px 12px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.06)}
.t-head{display:flex;justify-content:space-between;align-items:center;font:600 12px var(--body);letter-spacing:.07em;text-transform:uppercase;color:#d8c6a6}
.pips{display:flex;gap:5px;align-items:center}
.pip{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.2)}
.pip.on{background:var(--gold)}
.dice{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding-bottom:18px}
.die{aspect-ratio:1;border:0;border-radius:13px;background:linear-gradient(160deg,#f7efda,var(--bone) 55%,#dccfae);color:var(--dink,#333);display:grid;place-items:center;position:relative;padding:0;cursor:pointer;
  box-shadow:0 4px 0 var(--bone-lo),0 9px 14px rgba(0,0,0,.45);transition:transform .15s,box-shadow .15s}
.die svg{width:58%;height:58%}
.die[disabled]{cursor:default}
.die.blank{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 2px rgba(255,255,255,.13)}
.die.held{transform:translateY(-6px);box-shadow:0 0 0 3px var(--gold),0 4px 0 var(--bone-lo),0 12px 14px rgba(0,0,0,.4)}
.die .keep{position:absolute;left:0;right:0;bottom:-22px;text-align:center;font:700 11px var(--num);letter-spacing:.14em;color:var(--gold)}
.die.tgt{animation:pulse 1s ease-in-out infinite}
.die.pick{box-shadow:0 0 0 3px #fff,0 4px 0 var(--bone-lo),0 12px 14px rgba(0,0,0,.4);transform:translateY(-6px)}
.die.tumble{animation:tumble .5s cubic-bezier(.2,.8,.3,1)}
@keyframes tumble{0%{transform:translateY(-16px) rotate(-190deg) scale(.75);opacity:.2}60%{transform:translateY(2px) rotate(10deg) scale(1.06);opacity:1}100%{transform:none}}
@keyframes pulse{50%{transform:translateY(-3px)}}

/* turn steps */
.steps{display:flex;gap:4px;margin:0;padding:0;list-style:none}
.steps li{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:5px 2px;border-radius:8px;background:rgba(0,0,0,.2);color:#b3a186;font:600 12px var(--body);letter-spacing:.05em;text-transform:uppercase}
.steps li b{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:rgba(255,255,255,.12);font:700 11px var(--num);letter-spacing:0}
.steps li.cur{background:var(--gold);color:var(--gold-ink)}
.steps li.cur b{background:rgba(0,0,0,.2)}
.steps li.done{opacity:.55}

/* actions */
.actions{display:flex;gap:8px}
.actions.wait{min-height:48px;align-items:center;justify-content:center;color:var(--muted);font-weight:500}
.btn{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel-hi);font:600 16px var(--body);padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.btn[disabled]{opacity:.4;cursor:default}
.btn .n{font:700 13px var(--num);opacity:.7;letter-spacing:.04em}
.hint{margin:0;font-size:13px;color:var(--muted);text-align:center}
.tbar{display:grid;gap:8px}
.faces-pick{display:flex;gap:8px;justify-content:center}
.fbtn{width:52px;height:52px;border-radius:12px;border:0;background:var(--bone);color:var(--dink,#333);display:grid;place-items:center;cursor:pointer}

/* abilities */
.abilities{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-inline:-2px;scroll-snap-type:x proximity}
.ab{flex:0 0 130px;scroll-snap-align:start;display:grid;gap:5px;align-content:start;text-align:left;min-height:82px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 9px;cursor:pointer}
.ab .nm{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.05}
.ab .nm i{font:700 10px var(--num);letter-spacing:.12em;color:var(--gold);margin-left:5px;font-style:normal;vertical-align:2px}
.ab .rq{display:flex;gap:2px;flex-wrap:wrap;color:var(--hc)}
.ab .rq svg{width:15px;height:15px;opacity:.8}
.ab.live .rq svg{opacity:.25}
.ab.live .rq svg.have{opacity:1}
.ab .ef{font:600 13px var(--num);letter-spacing:.02em;color:var(--muted)}
.ab.ok{border-color:var(--gold);background:#2a2d3b}
.ab.ok .ef{color:var(--text)}
.ab.sel{outline:2px solid var(--gold);background:#3a3520}
.abtag{flex:0 0 64px;margin:0;scroll-snap-align:start;align-self:center;font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;line-height:1.25;color:var(--hc)}
.abilities.rival .ab{cursor:help}
/* response odds under the rival's dice */
.die .odds{position:absolute;left:0;right:0;bottom:-22px;text-align:center;font:700 12px var(--num);letter-spacing:.06em;color:#b3a186}
.die.key{box-shadow:0 0 0 3px var(--gold),0 4px 0 var(--bone-lo),0 9px 14px rgba(0,0,0,.45)}
.die.key .odds{color:var(--gold)}
.result{display:grid;gap:4px}
.result .hint{text-align:left}

/* hand */
.handwrap{position:relative;margin-top:auto}
.hand{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 6px;margin-inline:-2px}
.card{flex:0 0 110px;height:134px;border-radius:12px;background:linear-gradient(#2c3658,#1f2744);border:1px solid var(--line);padding:8px;display:grid;grid-template-rows:auto auto 1fr auto;gap:3px;text-align:left;position:relative;cursor:pointer;transition:transform .15s}
.card .ci{color:var(--gold)}
.card .cc{position:absolute;right:7px;top:7px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font:700 14px var(--num);display:grid;place-items:center}
.card .cn{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.02}
.card .ct{font-size:12px;line-height:1.2;color:#c3c9d8;overflow:hidden}
.card .cw{font:700 10px var(--num);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card .cw.roll{color:var(--gold)} .card .cw.react{color:var(--brine)}
.card.dim{opacity:.5}
.card.sel{transform:translateY(-9px);border-color:var(--gold);opacity:1}
.pop{position:absolute;left:0;right:0;bottom:calc(100% - 4px);z-index:5;background:#0f1529;border:1px solid var(--gold);border-radius:14px;padding:12px;display:grid;gap:8px;box-shadow:0 14px 32px rgba(0,0,0,.65)}
.pop h3{margin:0;font-family:var(--display);font-weight:800;font-size:21px;line-height:1}
.pop p{margin:0;color:#c3c9d8}
.pop .why{color:var(--gold);font-weight:600}

/* rules-era additions */
.cp{display:flex;align-items:center;gap:7px;background:none;border:0;padding:4px 0;cursor:pointer;font:inherit;color:inherit}
.cpbar{display:block;width:84px;height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.cpbar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.cpn{margin-left:0}
.fxnum.cp{color:var(--gold);font-size:22px}
.die .num{position:absolute;right:6px;top:4px;font:700 11px var(--num);color:var(--dink,#333);opacity:.75}
.die.blank .num{display:none}
.tlabel{display:flex;justify-content:space-between;align-items:center;margin-top:-2px;font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:#d8c6a6}
.table.defmode{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--hc) 70%,transparent),inset 0 3px 12px rgba(0,0,0,.55)}
.msg{margin:0;font-size:15px;line-height:1.35;color:var(--text)}
.msg b{color:var(--gold)}
.actions{flex-wrap:wrap}
.actions .btn{min-width:0}
.ab .rq .st{display:flex;gap:2px}
.ab .rq .st b,.rq.big .st b{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:4px;background:rgba(255,255,255,.12);font:700 10px var(--num);color:var(--text);opacity:.55}
.ab .rq .st b.have{background:var(--hc);color:#111;opacity:1}
.ab.live .rq .st b:not(.have){opacity:.3}
.rq.big .st b{width:26px;height:26px;font-size:15px;opacity:1}
.ab .nm i + i{margin-left:3px}
.ab.up{border-color:color-mix(in srgb,var(--t-upgrade) 55%,transparent)}
.ab.up .nm i:first-child{color:var(--t-upgrade)}
.ab.def{border-style:dashed;border-color:color-mix(in srgb,var(--hc) 60%,transparent)}
.ab.def .nm i{color:var(--hc)}
.abrow .rq{font:700 13px var(--num);align-items:center}
small.ult{color:var(--gold);font:700 10px var(--num);letter-spacing:.12em}
.card{border-top:3px solid var(--tc,var(--line))}
.card.t-main{--tc:var(--t-main)} .card.t-roll{--tc:var(--t-roll)} .card.t-instant{--tc:var(--t-instant)} .card.t-upgrade{--tc:var(--t-upgrade)}
.card .cw{color:var(--tc)}
.card.t-upgrade .ci{color:var(--t-upgrade)}
.cardhead.t-main .ci{color:var(--t-main)} .cardhead.t-roll .ci{color:var(--t-roll)} .cardhead.t-instant .ci{color:var(--t-instant)} .cardhead.t-upgrade .ci{color:var(--t-upgrade)}
.tline{font:600 13px var(--body);letter-spacing:.02em;margin:0}
.tline.t-main{color:var(--t-main)} .tline.t-roll{color:var(--t-roll)} .tline.t-instant{color:var(--t-instant)} .tline.t-upgrade{color:var(--t-upgrade)}
.types{list-style:none;padding:0!important;display:grid;gap:6px}
.types li{padding-left:10px;border-left:3px solid var(--tc)}
.types li b{color:var(--tc);margin-right:6px}
.types .t-main{--tc:var(--t-main)} .types .t-roll{--tc:var(--t-roll)} .types .t-instant{--tc:var(--t-instant)} .types .t-upgrade{--tc:var(--t-upgrade)}
.fbtn{position:relative;width:48px;height:52px}
.fbtn small,.mf small{position:absolute;right:4px;top:2px;font:700 10px var(--num);opacity:.7}
.mf{position:relative}
.faces-pick{flex-wrap:wrap}
.dd i{position:relative}
.dd i small{position:absolute;right:1px;top:-1px;font:700 8px var(--num);color:var(--ink);margin:0}

/* history */
.hist-btn{color:var(--text);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn.small{flex:none;min-height:40px;font-size:15px}
.hist{display:grid;gap:14px}
.turn{border-left:3px solid var(--hc);padding-left:11px;display:grid;gap:6px}
.turn h4{margin:0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;font:700 13px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--hc)}
.turn h4 span{color:var(--muted);font:600 13px var(--num);letter-spacing:.04em}
.turn ul{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.ev{font-size:14px;line-height:1.3}
.ev.sys{color:var(--muted)}
.ev.big{font-weight:600}
.dd{display:flex;align-items:center;gap:3px;margin-top:4px}
.dd i{width:24px;height:24px;border-radius:6px;background:var(--bone);color:var(--ink);display:grid;place-items:center}
.dd small{margin-left:6px;font:600 12px var(--num);color:var(--muted);letter-spacing:.04em}

/* keyword explanations */
.gloss{display:grid;gap:6px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05)}
.gloss p{font-size:14px;color:#c3c9d8}
.gloss b{color:var(--gold)}
.rq.big{display:flex;gap:5px;color:var(--hc)}
.rq.big svg{width:26px;height:26px}

/* card sheet */
.cardhead{display:flex;align-items:center;gap:10px}
.cardhead h2{flex:1}
.cardhead .ci{color:var(--gold);display:grid}
.cc.big{font:700 20px var(--num);color:var(--gold)}
.cardtext{font-size:18px}
.sheet .when{color:var(--muted);font-size:14px}
.sheet .why{color:var(--gold);font-weight:600}

/* sheets */
.back{position:fixed;inset:0;background:rgba(5,8,18,.64);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88%;overflow:auto;background:#161d33;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  padding-top:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -14px 40px rgba(0,0,0,.5)}
.sheet .in{max-width:460px;margin:0 auto;display:grid;gap:12px}
.sheet h2{margin:0;font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.sheet h3{margin:6px 0 0;font:700 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet p{margin:0}
.sheet ol,.sheet ul{margin:0;padding-left:20px;display:grid;gap:6px}
.abl{display:grid;gap:6px}
.abrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 10px;border-radius:10px;background:var(--panel);align-items:center}
.abrow .nm{font-family:var(--display);font-weight:800;font-size:17px}
.abrow .rq{display:flex;gap:2px;justify-content:flex-end;color:var(--hc)}
.abrow .rq svg{width:15px;height:15px}
.abrow .ef{grid-column:1/-1;font:600 13px var(--num);color:var(--muted);letter-spacing:.02em}
.facesrow{display:flex;gap:6px}
.mf{width:34px;height:34px;border-radius:8px;background:var(--bone);color:var(--ink,#333);display:grid;place-items:center}
.menulist{display:grid;gap:8px}
.logfull{display:grid;gap:5px;font-size:14px}
.logfull div{padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.04)}
.rc{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--gold);background:#242a3f;cursor:pointer}
.rc[disabled]{opacity:.4;cursor:default;border-color:var(--line)}
.rc .cn{font-family:var(--display);font-weight:800;font-size:17px}
.rc .cc{font:700 14px var(--num);color:var(--gold)}
.rc .ct{grid-column:1/-1;font-size:13px;color:#c3c9d8}
.over h2{font-size:48px}
.over .win{color:var(--gold)} .over .lose{color:var(--bad)}

/* start screen */
.start{display:grid;gap:18px;padding-block:14px 18px}
.logo{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(46px,14vw,68px);line-height:.9}
.logo span{color:var(--gold)}
.tag{margin:10px 0 0;color:var(--muted);font-size:16px;max-width:34ch}
.heroes{display:grid;gap:12px}
.hero{display:grid;gap:11px;text-align:left;background:linear-gradient(160deg,color-mix(in srgb,var(--hc) 22%,#1a2238),#1a2238 62%);border:1px solid color-mix(in srgb,var(--hc) 50%,transparent);border-radius:16px;padding:14px;cursor:pointer}
.hero .hh{display:flex;align-items:center;gap:12px}
.hero .hn{font-family:var(--display);font-weight:800;font-size:29px;line-height:1}
.hero .he{color:var(--muted);font-size:14px;margin-top:3px}
.hero .hs{margin:0;font-size:15px}
.hero .go{font:700 14px var(--num);letter-spacing:.1em;text-transform:uppercase;color:var(--hc)}
.resume{display:grid;gap:5px;text-align:left;padding:14px;border-radius:16px;border:2px solid var(--gold);background:linear-gradient(160deg,color-mix(in srgb,var(--hc) 20%,#1a2238),#1a2238 70%);cursor:pointer}
.resume .rk{font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.resume .rt{font-family:var(--display);font-weight:800;font-size:25px;line-height:1.05}
.resume .rt i{font-style:normal;color:var(--muted);font-size:18px}
.resume .rs{color:var(--muted);font-size:15px}
.resume .rh{display:flex;gap:12px;font:700 16px var(--num);letter-spacing:.03em;color:var(--muted)}
.resume .go{margin-top:4px;font:700 15px var(--num);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.newduel{margin:0;font:700 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.start-foot{display:flex;justify-content:space-between;align-items:center}
.linkbtn{background:none;border:0;padding:8px 0;color:var(--gold);font:600 15px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.rec{font:600 14px var(--num);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.proto{margin:0;font-size:13px;color:var(--muted)}
.ver{white-space:nowrap;font-family:var(--num);letter-spacing:.04em}

/* desktop: side history hidden on phones */
.side{display:none}
.sidehead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sidehead h3{margin:0;font:700 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sidehead span{font-size:12px;color:var(--muted)}
@media (min-width:1000px){
  #app{max-width:1320px}
  .game{display:grid;grid-template-columns:minmax(360px,1fr) minmax(0,1.3fr) 320px;
    grid-template-areas:"opp opp log" "tray abil side" "me me side" "hand hand side";gap:12px 14px;align-items:start;align-content:start;min-height:0}
  .panel.opp{grid-area:opp} .logrow{grid-area:log;justify-content:flex-end;align-self:stretch}
  .table{grid-area:tray} .abilities{grid-area:abil} .panel.me{grid-area:me} .handwrap{grid-area:hand;margin-top:0}
  .side{grid-area:side;display:grid;gap:10px;align-content:start;contain:size;align-self:stretch;min-height:420px;overflow:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .side .ev{font-size:13px}
  .logline,.hist-btn{display:none}
  .abilities{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));overflow:visible;padding:0;margin:0;align-content:start;scroll-snap-type:none}
  .ab{min-height:78px}
  .abtag{grid-column:1/-1}
  .hand{flex-wrap:wrap;overflow:visible;padding:4px 0 0;margin:0}
  .card{flex:0 0 136px;height:160px}
  .card .ct{font-size:13px}
  .card:hover:not(.dim){transform:translateY(-4px)}
  .ab:hover,.btn:hover:not([disabled]){filter:brightness(1.08)}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(580px,92vw);max-height:86vh;
    border:1px solid var(--line);border-radius:18px;padding:20px 24px}
  .start{max-width:980px;margin:0 auto;padding-top:28px}
  .heroes{grid-template-columns:1fr 1fr}
  .tag{max-width:none}
}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-14px);width:max-content;max-width:min(92vw,420px);background:#0b1124;border:1px solid var(--gold);color:var(--text);padding:9px 14px;border-radius:12px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
</style>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
